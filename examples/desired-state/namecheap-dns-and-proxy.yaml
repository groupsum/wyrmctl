---
apiVersion: wyrmctl.com/v1
kind: DesiredState
schemaVersion: 3
metadata:
  name: wyrmctl-lander-desired-state
  owner: wyrmctl-lander
spec:
  proxyHosts:
    - domain_names:
        - wyrmctl.com
        - www.wyrmctl.com
      forward_host: wyrmctl_lander
      forward_port: 80
      forward_scheme: http
      meta:
        managed_by: wyrmctl
        owner: wyrmctl-lander
        resource_id: proxy.wyrmctl-com
  certificates: []
  accessLists: []
  redirectionHosts: []
  deadHosts: []
  streams: []
  users: []
  settings: []
  dnsRecords:
    - provider: namecheap
      zone: wyrmctl.com
      type: A
      name: '@'
      value: 172.16.0.10
      ttl: 300
      meta:
        managed_by: wyrmctl
        owner: wyrmctl-lander
        resource_id: dns.wyrmctl-com.root-a
    - provider: namecheap
      zone: wyrmctl.com
      type: CNAME
      name: www
      value: wyrmctl.com
      ttl: 300
      meta:
        managed_by: wyrmctl
        owner: wyrmctl-lander
        resource_id: dns.wyrmctl-com.www-cname
  pluginResources: []
  externalCertificates: []
