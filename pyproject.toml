[project]
name = "wyrmctl-workspace"
version = "0.4.3"
description = "Workspace root for wyrmctl, an owner-scoped Nginx Proxy Manager controller."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = [
  "nginx-proxy-manager",
  "npm",
  "reverse-proxy",
  "gitops",
  "desired-state",
  "infrastructure-as-code",
  "controller",
  "plan-apply",
  "owner-scoped",
  "dns",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "Intended Audience :: System Administrators",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Internet :: Name Service (DNS)",
  "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
  "Topic :: System :: Networking",
  "Topic :: System :: Systems Administration",
  "Typing :: Typed",
]

[tool.uv]
package = false

[tool.uv.sources]
wyrmctl = { workspace = true }

[tool.uv.workspace]
members = [
  "packages/wyrmctl",
  "packages/wyrmctl-cloudflare",
  "packages/wyrmctl-digitalocean",
  "packages/wyrmctl-godaddy",
  "packages/wyrmctl-namecheap",
  "packages/wyrmctl-route53",
]

[dependency-groups]
dev = [
  "build>=1.2.2",
  "coverage[toml]>=7.8.0",
  "jsonschema>=4.25.0",
  "pytest>=8.3.0",
  "pytest-cov>=6.0.0",
  "PyYAML>=6.0.2",
  "requests>=2.32.0",
  "ruff>=0.12.0",
  "ssot-registry==0.2.13",
  "uv-build>=0.11.8,<0.12",
  "yamllint>=1.35.0",
]

[tool.ruff]
line-length = 120
target-version = "py310"
src = [
  "packages/wyrmctl/src",
  "packages/wyrmctl/tests",
  "packages/wyrmctl-cloudflare/src",
  "packages/wyrmctl-cloudflare/tests",
  "packages/wyrmctl-digitalocean/src",
  "packages/wyrmctl-digitalocean/tests",
  "packages/wyrmctl-godaddy/src",
  "packages/wyrmctl-godaddy/tests",
  "packages/wyrmctl-namecheap/src",
  "packages/wyrmctl-namecheap/tests",
  "packages/wyrmctl-route53/src",
  "packages/wyrmctl-route53/tests",
  "scripts",
  "tools",
]

[tool.ruff.lint]
select = ["B", "C4", "E", "F", "I", "PT", "PTH", "RUF", "SIM", "UP", "W"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"packages/wyrmctl/tests/**/*.py" = ["PT011", "RUF012", "PLC0415"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config --cov=wyrmctl --cov-report=term-missing"
testpaths = [
  "packages/wyrmctl/tests",
  "packages/wyrmctl-cloudflare/tests",
  "packages/wyrmctl-digitalocean/tests",
  "packages/wyrmctl-godaddy/tests",
  "packages/wyrmctl-namecheap/tests",
  "packages/wyrmctl-route53/tests",
]
pythonpath = [
  "packages/wyrmctl/src",
  "packages/wyrmctl-cloudflare/src",
  "packages/wyrmctl-digitalocean/src",
  "packages/wyrmctl-godaddy/src",
  "packages/wyrmctl-namecheap/src",
  "packages/wyrmctl-route53/src",
]
markers = [
  "integration: integration tests using a local fake NPM API server",
  "npm: tests against a real Nginx Proxy Manager instance; opt in with NPMCTL_REAL_NPM=1",
]

[tool.coverage.run]
branch = true
source = ["wyrmctl"]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 100
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
]
