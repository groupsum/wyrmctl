slug: "immutable-plan-artifact"
title: "Immutable plan artifact and reviewed execution"
status: "accepted"
origin: "repo-local"
decision_date: null
tags: []
summary: "A PlanArtifact SHALL identify repository, commit, owner, environment, contract versions, tool and provider versions, desired-state digests, plan-scoped live-state fingerprint, operations, conflicts, destructive effects, and expiry. The fingerprint SHALL cover every live resource owned by an owner represented in the plan and every foreign or unmanaged resource capable of colliding with a planned natural key, proxy domain, compatible certificate domain set, or explicit certificate/access-list identifier. Apply SHALL consume the reviewed artifact and reject digest mismatch, target mismatch, scoped live-state staleness, or expiration. Unrelated live resources owned by owners absent from the plan SHALL NOT invalidate the artifact."
