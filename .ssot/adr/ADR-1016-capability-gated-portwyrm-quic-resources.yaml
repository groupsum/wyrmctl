summary: "Context: hostname-routed QUIC passthrough is a Portwyrm-native resource and cannot be inferred from Nginx Proxy Manager stream endpoints. Decision: Wyrmctl validates schema v3 quicPassthroughHosts, authenticates capability discovery, requires supported=true and tls_termination=false, and fails closed for unsupported or ambiguous providers. Apply consumes the reviewed PlanArtifact without re-planning. Consequences: Portwyrm routes remain owner-scoped and NPM profiles cannot silently misapply them."
