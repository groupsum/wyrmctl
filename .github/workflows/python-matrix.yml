---
name: Python Matrix

on:
  push:
    branches: [master, "v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: wyrmctl-python-matrix-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pytest:
    name: Python ${{ matrix.python-version }}
    runs-on:
      group: shortlived
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-uv-python
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: false
      - run: uv run python -m compileall -q packages/wyrmctl/src
      - run: uv run python -m compileall -q packages/wyrmctl-cloudflare/src
      - run: uv run python -m compileall -q packages/wyrmctl-digitalocean/src
      - run: uv run python -m compileall -q packages/wyrmctl-godaddy/src
      - run: uv run python -m compileall -q packages/wyrmctl-namecheap/src
      - run: uv run python -m compileall -q packages/wyrmctl-route53/src
      - run: >
          uv run pytest
          packages/wyrmctl/tests
          packages/wyrmctl-cloudflare/tests
          packages/wyrmctl-digitalocean/tests
          packages/wyrmctl-godaddy/tests
          packages/wyrmctl-namecheap/tests
          packages/wyrmctl-route53/tests
