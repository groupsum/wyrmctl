---
name: Docs and SSOT

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: wyrmctl-docs-ssot-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  docs-ssot:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-uv-python
      - uses: ./.github/actions/wyrmctl-ssot-gate
