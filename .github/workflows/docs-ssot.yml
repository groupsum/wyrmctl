---
name: Docs and SSOT

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: wyrmctl-docs-ssot-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  docs-ssot:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on:
      group: shortlived
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-uv-python
      - uses: ./.github/actions/wyrmctl-ssot-gate
