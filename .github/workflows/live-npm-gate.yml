---
name: Live NPM Gate

on:
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * *"

concurrency:
  group: wyrmctl-live-npm-gate-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  e2e:
    runs-on:
      group: shortlived
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-uv-python
      - uses: ./.github/actions/wyrmctl-real-npm-e2e
