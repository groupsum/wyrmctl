name: Publish DNS provider

on:
  workflow_dispatch:
    inputs:
      provider:
        description: DNS provider distribution to publish
        required: true
        type: choice
        options:
          - cloudflare
          - digitalocean
          - godaddy
          - namecheap
          - route53

permissions:
  contents: read

concurrency:
  group: wyrmctl-provider-pypi
  cancel-in-progress: false

jobs:
  build:
    runs-on:
      group: shortlived
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-uv-python
      - name: Test provider
        env:
          PROVIDER: ${{ inputs.provider }}
        run: uv run pytest "packages/wyrmctl-${PROVIDER}/tests" -o addopts= -q
      - name: Build provider distributions
        env:
          PROVIDER: ${{ inputs.provider }}
        run: uv build --package "wyrmctl-${PROVIDER}" --out-dir dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: provider-dist
          path: dist/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on:
      group: shortlived
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: provider-dist
          path: dist
      - name: Publish with Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
        env:
          DOCKER_API_VERSION: '1.43'
